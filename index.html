<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join the alpha · Edunex Plus</title>
  <meta name="description" content="Edunex and SIX in one calm window. Edunex Plus is in alpha: join the first ITB students using it.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08080a">
  <link rel="canonical" href="https://alphatester.arqilasp.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Edunex Plus">
  <meta property="og:title" content="Join the Edunex Plus alpha">
  <meta property="og:description" content="Edunex and SIX in one calm window. Join the first ITB students using it.">
  <meta property="og:url" content="https://alphatester.arqilasp.com/">
  <meta property="og:image" content="https://alphatester.arqilasp.com/assets/social.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preload" href="fonts/dm-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* DM Sans and Instrument Serif, SIL Open Font License: see fonts/. */
    @font-face { font-family: "DM Sans"; font-weight: 400; font-display: swap; src: url(fonts/dm-sans-latin-400-normal.woff2) format("woff2"); }
    @font-face { font-family: "DM Sans"; font-weight: 500; font-display: swap; src: url(fonts/dm-sans-latin-500-normal.woff2) format("woff2"); }
    @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }

    :root {
      --bg: #08080a;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; background: var(--bg); }
    body {
      min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column;
      overflow-x: hidden;
      color: var(--fg);
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      /* One soft light behind the app, and a faint one behind the headline. */
      background:
        radial-gradient(60% 45% at 50% 78%, #2f6feb26, transparent 70%),
        radial-gradient(40% 30% at 50% 0%, #2f6feb14, transparent 70%),
        var(--bg);
    }
    a { color: inherit; text-decoration: none; }
    img, svg { display: block; }
    :focus-visible { outline: 2px solid #7aa2ff; outline-offset: 3px; border-radius: 8px; }

    main {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: clamp(56px, 12vh, 150px) 24px 0;
    }
    .mark { width: 44px; height: 44px; }
    h1 {
      margin-top: 28px;
      font-size: clamp(42px, 6.4vw, 80px); font-weight: 500; letter-spacing: -0.04em; line-height: 1.04;
    }
    h1 span { display: block; }
    h1 em {
      font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400;
      letter-spacing: -0.01em; font-size: 1.12em; color: #dfe6ff;
      padding-right: 0.06em;
    }
    .sub { margin-top: 22px; max-width: 440px; font-size: 18px; color: var(--muted); text-wrap: pretty; }
    .btn {
      margin-top: 34px;
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 24px; border-radius: 12px;
      background: #fafafa; color: #09090b;
      font-size: 16px; font-weight: 500;
      box-shadow: 0 8px 30px -10px #9db4ff80;
      transition: transform 0.2s var(--ease), background 0.2s;
    }
    .btn svg { width: 16px; height: 16px; transition: transform 0.2s var(--ease); }
    .btn:hover { background: #fff; transform: translateY(-1px); }
    .btn:hover svg { transform: translateX(3px); }
    .btn:active { transform: none; }

    /* A sneak peek: only the top-left corner of the app, fading out toward the rest. */
    .peek {
      --w: min(1440px, 124vw);
      flex: 1; position: relative; overflow: hidden;
      min-height: calc(var(--w) * 0.3);
      margin-top: 72px;
      /* Fade out before the bottom, so the app never ends in a hard line. */
      -webkit-mask-image: linear-gradient(#000 45%, transparent 96%);
      mask-image: linear-gradient(#000 45%, transparent 96%);
    }
    .window {
      position: absolute; top: 0;
      /* Shift right so the part that shows, not the whole window, sits in the middle. */
      left: calc(50% - var(--w) * 0.3);
      width: var(--w);
      border-radius: 14px; overflow: hidden;
      background: #141416;
      box-shadow: inset 0 0 0 1px #ffffff1f;
      -webkit-mask-image: radial-gradient(62% 100% at 0% 0%, #000 50%, transparent 100%);
      mask-image: radial-gradient(62% 100% at 0% 0%, #000 50%, transparent 100%);
      animation: up 1.4s var(--ease) 0.45s both;
    }
    .window img { width: 100%; height: auto; }
    .window::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px #ffffff1f; pointer-events: none; }
    .lights { position: absolute; top: 2.3%; left: 1.4%; display: flex; gap: clamp(5px, 0.6vw, 8px); }
    .lights i { width: clamp(9px, 0.95vw, 12px); aspect-ratio: 1; border-radius: 50%; background: #ff5f57; }
    .lights i:nth-child(2) { background: #febc2e; }
    .lights i:nth-child(3) { background: #28c840; }

    footer { padding: 24px 20px 28px; text-align: center; font-size: 12px; color: #63636e; }
    footer a { text-decoration: underline; text-decoration-color: #63636e80; text-underline-offset: 3px; }
    footer a:hover { color: var(--fg); }

    .in { animation: up 0.8s var(--ease) both; animation-delay: var(--d, 0ms); }
    @keyframes up { from { opacity: 0; transform: translateY(16px); } }

    @media (max-width: 640px) {
      main { padding-top: 64px; }
      .sub { font-size: 16px; }
      .peek { --w: 190vw; margin-top: 56px; min-height: 100vw; }
      .window { left: 6vw; border-radius: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .in, .window { animation: none; }
      .btn, .btn svg { transition: none; }
      .btn:hover, .btn:hover svg { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="mark in" src="assets/icon-128.png" alt="Edunex Plus" width="44" height="44">
    <h1>
      <span class="in" style="--d:80ms">Edunex and SIX,</span>
      <span class="in" style="--d:160ms">in one <em>calm window.</em></span>
    </h1>
    <p class="sub in" style="--d:260ms">Edunex Plus is in alpha. Join the first ITB students using it, and help shape what it becomes.</p>
    <a class="btn in" style="--d:340ms" href="https://forms.gle/Ajaj2wM6q6kHhH4R6">
      Join the alpha
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </main>

  <div class="peek">
    <div class="window">
      <img src="assets/home.webp" srcset="assets/home-1440.webp 1440w, assets/home.webp 2880w" sizes="(max-width: 640px) 190vw, (max-width: 1161px) 124vw, 1440px" width="2880" height="1606" alt="A peek at the Edunex Plus home screen: the sidebar, the greeting, and the class on now" fetchpriority="high" decoding="async">
      <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
  </div>

  <footer>
    Unofficial. Made by ITB students, not by ITB or Cognisia · Supported by <a href="https://ganesaspace.com" target="_blank" rel="noopener noreferrer">Ganesa Space</a>
  </footer>
</body>
</html>
